[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{ Name }}"
version = "0.1.0"
description = "AgentCore Code-Based Evaluator (DeepEval)"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore[deepeval]",
    "deepeval>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
