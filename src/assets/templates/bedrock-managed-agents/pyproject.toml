[project]
name = "{{ name }}"
version = "0.1.0"
description = "AgentCore Runtime environment for Bedrock Managed Agents"
readme = "README.md"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore",
]

# The dependencies of client.py. The image build runs `uv sync --no-dev`.
[dependency-groups]
dev = [
    "aws-bedrock-token-generator>=1.1.0",
    "openai>=3.16.2",
]

[tool.uv]
package = false
