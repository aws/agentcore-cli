[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "{{ name }}"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore[strands-agents] >= 1.18.1, < 2.0.0",
    "botocore[crt] ~= 1.43.0",
    "strands-agents{{#if (eq modelProvider "Anthropic")}}[anthropic]{{else}}{{#if (eq modelProvider "OpenAI")}}[openai]{{else}}{{#if (eq modelProvider "Gemini")}}[gemini]{{else}}{{#if (eq modelProvider "LiteLLM")}}[litellm]{{/if}}{{/if}}{{/if}}{{/if}} >= 1.15.0, < 2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
