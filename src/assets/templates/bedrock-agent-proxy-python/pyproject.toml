[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{name}}"
version = "0.1.0"
description = "AgentCore Runtime proxy for the Amazon Bedrock Agent {{agentName}}"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "boto3 >= 1.35.0",
    "botocore[crt] >= 1.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
