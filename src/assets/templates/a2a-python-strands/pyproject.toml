[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "{{ name }}"
version = "0.1.0"
description = "AgentCore A2A Agent using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[all] ~= 0.3.0",
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore[a2a,strands-agents] >= 1.18.1, < 2.0.0",
    "botocore[crt] ~= 1.43.0",
    "strands-agents{{#if (eq modelProvider "Anthropic")}}[anthropic]{{else}}{{#if (or (eq modelProvider "OpenAI") (eq modelProvider "OpenAICompatible"))}}[openai]{{else}}{{#if (eq modelProvider "Gemini")}}[gemini]{{else}}{{#if (eq modelProvider "LiteLLM")}}[litellm]{{/if}}{{/if}}{{/if}}{{/if}} >= 1.15.0, < 2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
