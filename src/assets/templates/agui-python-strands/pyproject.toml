[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "{{ name }}"
version = "0.1.0"
description = "AgentCore AG-UI Agent using Strands SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-strands >= 0.3.0, < 0.4.0",
    "ag-ui-protocol >= 0.1.19, < 0.2.0",
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[strands-agents] >= 1.18.1, < 2.0.0",
    "botocore[crt] ~= 1.43.0",
    {{#if (eq modelProvider "Anthropic")}}"strands-agents[anthropic] >= 1.15.0, < 2.0.0",
    {{else}}{{#if (eq modelProvider "OpenAI")}}"strands-agents[openai] >= 1.15.0, < 2.0.0",
    {{else}}{{#if (eq modelProvider "Gemini")}}"strands-agents[gemini] >= 1.15.0, < 2.0.0",
    {{else}}{{#if (eq modelProvider "LiteLLM")}}"strands-agents[litellm] >= 1.15.0, < 2.0.0",
    {{else}}"strands-agents >= 1.15.0, < 2.0.0",
    {{/if}}{{/if}}{{/if}}{{/if}}
    "uvicorn >= 0.34.3, < 1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
