[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "{{ name }}"
version = "0.1.0"
description = "AgentCore AG-UI Agent using Strands SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-strands >= 0.3.0, < 0.4.0",
    "ag-ui-protocol >= 0.1.19, < 0.2.0",
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore[strands-agents] >= 1.18.1, < 2.0.0",
    "botocore[crt] ~= 1.43.0",
    "fastapi >= 0.142.0, < 1.0.0",
    "strands-agents{{#if (eq modelProvider "Anthropic")}}[anthropic]{{else}}{{#if (or (eq modelProvider "OpenAI") (eq modelProvider "OpenAICompatible"))}}[openai]{{else}}{{#if (eq modelProvider "Gemini")}}[gemini]{{else}}{{#if (eq modelProvider "LiteLLM")}}[litellm]{{/if}}{{/if}}{{/if}}{{/if}} >= 1.15.0, < 2.0.0",
    "uvicorn >= 0.34.3, < 1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
