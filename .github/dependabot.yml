version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'
      aws-cdk:
        patterns:
          - '@aws-cdk/*'
          - 'aws-cdk-lib'
      dev-dependencies:
        dependency-type: 'development'
        patterns:
          - '@types/*'
          - 'eslint*'
          - 'prettier*'
          - 'vitest*'
          - '@trivago/*'
          - '@typescript-eslint/*'
          - 'typescript-eslint'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Workaround for dependabot/dependabot-core#14202: without an explicit
      # major group, major updates matching the minor-and-patch pattern are
      # silently suppressed. Remove this group when #14202 is fixed to get
      # individual (ungrouped) PRs per major bump instead.
      major:
        patterns:
          - '*'
        update-types:
          - 'major'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    open-pull-requests-limit: 10
