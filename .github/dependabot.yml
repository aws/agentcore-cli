version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - "@smithy/*"
      aws-cdk:
        patterns:
          - "@aws-cdk/*"
          - "aws-cdk-lib"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "@types/*"
          - "@secretlint/*"
          - "oxlint"
          - "prettier*"
          - "secretlint"
          - "vitest*"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Dependabot reads this file from the repository default branch. These entries
  # keep v0 version updates running after v1.x becomes default; target-branch
  # makes Dependabot read v0's manifests and open PRs against v0.
  # Change target-branch to v0.x when main is renamed.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - "@smithy/*"
      aws-cdk:
        patterns:
          - "@aws-cdk/*"
          - "aws-cdk-lib"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "vitest*"
          - "@trivago/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
