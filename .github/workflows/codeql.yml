name: CodeQL

on:
  push:
    branches: [main, refactor, v1.x]
  pull_request:
    branches: [main, refactor, v1.x, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/refactor' && github.ref != 'refs/heads/v1.x' }}

jobs:
  analyze:
    name: Analyze
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    permissions:
      actions: read
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
