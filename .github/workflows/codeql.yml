name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main', 'feat/**']
  pull_request_target:
    branches: ['main', 'feat/**']

# Cancel in-progress runs for PRs; never cancel runs on main (merges should not abort each other)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze
    # Stays on a GitHub-hosted runner: CodeQL's query evaluation OOMs on the
    # CodeBuild general1.small runner (3 GB; CodeQL needs more). CodeQL does no
    # AWS/service calls, so it has no WAF exposure and gains nothing from CodeBuild.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
