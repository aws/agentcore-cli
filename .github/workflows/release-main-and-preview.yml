name: Release v0

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'v0 version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
      changelog:
        description: 'Changelog entry (optional)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — create PR but skip npm publish'
        required: false
        type: boolean
        default: false
      cdk_dist_tag:
        description: '@aws/agentcore-cdk npm dist-tag to pin the vended CDK template to (default: latest)'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: write
  pull-requests: write

env:
  AGENTCORE_TELEMETRY_DISABLED: '1'

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Step 1 — Prepare v0 release PR
  # ═══════════════════════════════════════════════════════════════════
  prepare-release:
    name: Prepare Release
    runs-on: aws-release-4-core
    outputs:
      version: ${{ steps.bump.outputs.version }}
      branch: ${{ steps.create-pr.outputs.branch }}

    steps:
      - name: Checkout v0 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Verify v0 release branch and version
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          if [[ "$BUMP_TYPE" != "patch" && "$BUMP_TYPE" != "minor" ]]; then
            echo "❌ v0 releases only support patch or minor bumps, not $BUMP_TYPE."
            exit 1
          fi
          if [[ "$BRANCH_NAME" != "main" && "$BRANCH_NAME" != "v0.x" ]]; then
            echo "❌ v0 releases must run from main or v0.x, not $BRANCH_NAME."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" != 0.* ]]; then
            echo "❌ Expected a v0 package version, found $VERSION."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - run: npm ci

      - name: Bump v0 version
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          CHANGELOG_INPUT: ${{ github.event.inputs.changelog }}
        run: |
          BUMP_CMD="npx tsx scripts/bump-version.ts $BUMP_TYPE"
          if [ -n "$CHANGELOG_INPUT" ]; then
            BUMP_CMD="$BUMP_CMD --changelog \"$CHANGELOG_INPUT\""
          fi
          eval $BUMP_CMD

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 v0 version: $NEW_VERSION"

      - name: Sync vended CDK version
        env:
          CDK_DIST_TAG: ${{ github.event.inputs.cdk_dist_tag }}
        run: |
          npx tsx scripts/sync-vended-cdk.ts --tag "${CDK_DIST_TAG:-latest}"
          npx prettier --write src/assets/cdk/package.json

      - name: Regenerate JSON schema
        run: |
          npm run build
          node scripts/generate-schema.mjs
          npx prettier --write schemas/

      - name: Update snapshots
        run: npm run test:update-snapshots

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create release branch and PR
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          BRANCH_NAME="release/v${VERSION}"
          TITLE="Release v$VERSION"
          COMMIT_MSG="chore: bump v0 to $VERSION"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git ls-remote --exit-code --heads origin "$BRANCH_NAME" && git push origin --delete "$BRANCH_NAME" || true
          git show-ref --verify --quiet "refs/heads/$BRANCH_NAME" && git branch -D "$BRANCH_NAME" || true

          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH_NAME"

          # Build PR body
          BODY="## $TITLE

          | Package | Version | npm Tag |
          |---------|---------|---------|"
          BODY="$BODY
          | @aws/agentcore | $VERSION | v0-latest |

          ### Checklist
          - [ ] Review CHANGELOG.md
          - [ ] All CI checks passing
          - [ ] Merge this PR before approving the publish step"

          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH_NAME" \
            --label release \
            --title "$TITLE" \
            --body "$BODY"

  # ═══════════════════════════════════════════════════════════════════
  # Step 2 — Manual approval gate
  # ═══════════════════════════════════════════════════════════════════
  release-approval:
    name: Release Approval
    needs: [prepare-release]
    runs-on: aws-release-4-core
    environment:
      name: npm-publish-approval
    steps:
      - name: Approval checkpoint
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          echo "📦 v0 version: $VERSION (npm tag: v0-latest)"
          echo ""
          echo "⚠️  MANUAL APPROVAL REQUIRED"
          echo ""
          echo "Before approving:"
          echo "1. Verify PR CI checks are passing"
          echo "2. Merge the release PR to the selected v0 branch"
          echo "3. Verify the PR is merged"

  # ═══════════════════════════════════════════════════════════════════
  # Step 3 — Verify PR merged
  # ═══════════════════════════════════════════════════════════════════
  verify-merge:
    name: Verify PR Merged
    needs: [prepare-release, release-approval]
    if: ${{ !inputs.dry_run }}
    runs-on: aws-release-4-core
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify v0 version
        env:
          EXPECTED: ${{ needs.prepare-release.outputs.version }}
        run: |
          git fetch origin ${{ github.ref_name }}
          ACTUAL=$(git show origin/${{ github.ref_name }}:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ Release PR not merged yet!"
            echo "Expected v0 version: $EXPECTED, Got: $ACTUAL"
            exit 1
          fi
          echo "✅ v0 version verified: $ACTUAL"

  # ═══════════════════════════════════════════════════════════════════
  # Step 4 — Publish v0 to npm (tag: v0-latest)
  # ═══════════════════════════════════════════════════════════════════
  publish-main:
    name: Publish v0 (@v0-latest)
    needs: [prepare-release, verify-merge]
    runs-on: aws-release-4-core
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@aws/agentcore
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout v0 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance --tag v0-latest

      - name: Tag and release
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: AgentCore CLI v${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
          prerelease: false
          make_latest: false
          body: |
            ## Installation

            ```bash
            npm install -g @aws/agentcore@${{ needs.prepare-release.outputs.version }}
            ```

  # ═══════════════════════════════════════════════════════════════════
  # Summary
  # ═══════════════════════════════════════════════════════════════════
  summary:
    name: Release Summary
    needs: [prepare-release, publish-main]
    if: always() && !cancelled()
    runs-on: aws-release-4-core
    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          MAIN_STATUS: ${{ needs.publish-main.result }}
        run: |
          echo "## Release Summary"
          echo ""
          echo "| Package | Version | npm Tag | Status |"
          echo "|---------|---------|---------|--------|"
          echo "| @aws/agentcore | $VERSION | v0-latest | $MAIN_STATUS |"
