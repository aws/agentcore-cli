# Publishes @aws/agentcore to npm and creates the GitHub release when a release PR from
# release-prepare.yml merges. The version is whatever the merged package.json says.
# The filename and the npm-publish environment are what the package's npm trusted publisher
# is registered with, and that registration cannot be edited.
name: release-publish
on:
  # Dispatch publishes the version in package.json at the chosen ref when it is not on npm yet,
  # for a release whose merge push never ran.
  workflow_dispatch:
  push:
    # TODO: switch to main once the refactor lands and this workflow is allowlisted there.
    branches: [refactor]

jobs:
  check-release:
    if: "!github.event.deleted"
    runs-on: ["codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}", "verify-linux"]
    permissions:
      pull-requests: read
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      # Push runs the trusted base-branch workflow, but does not carry the merged PR's metadata.
      - name: Check for a merged release PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IS_RELEASE=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            | jq -r --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" '
                any(.[][];
                  # Stable account ID for agentcore-devx-automation[bot].
                  .user.id == 282717993 and
                  .merged_at != null and
                  .merge_commit_sha == $sha and
                  .head.repo.full_name == $repository and
                  .base.ref == $ref and
                  (.head.ref | startswith("release/v"))
                )')
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && IS_RELEASE=true
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

  verify:
    needs: check-release
    if: needs.check-release.outputs.is_release == 'true'
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      macos: false

  publish:
    needs: verify
    # Trusted publishing works from this runner, provenance would not: npm only signs
    # provenance on GitHub-hosted runners, and the org's hosted pool never picks this repo up.
    runs-on: ["codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}", "verify-linux"]
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@aws/agentcore
    permissions:
      contents: write
      id-token: write
    env:
      REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
      # npm trusted publishing needs npm 11.5.1 or newer, Node 20 bundles npm 10.
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile

      - name: Resolve release
        id: release
        run: |
          set -euo pipefail
          VERSION=$(bun pm pkg get version | tr -d '"')
          # rc notes span from the previous rc, stable notes from the previous stable. Only this
          # workflow's tags count, main's v1.0.0-preview.N tags live in the same repo.
          DIST_TAG=latest
          SEMVER_FLAGS=()
          if [[ "$VERSION" == *-rc.* ]]; then
            DIST_TAG=rc
            SEMVER_FLAGS=(--include-prerelease)
          fi
          PREVIOUS=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
            | xargs bunx semver "${SEMVER_FLAGS[@]}" --range "<$VERSION" | tail -1)
          {
            echo "version=$VERSION"
            echo "dist_tag=$DIST_TAG"
            echo "previous_tag=v$PREVIOUS"
          } >> "$GITHUB_OUTPUT"

      - run: bun run build
      - id: pack
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts)" >> "$GITHUB_OUTPUT"
      - run: bun run compile

      - env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        # A rerun after a failed release step must not republish, npm rejects an existing version.
        run: |
          if npm view "@aws/agentcore@$VERSION" version >/dev/null 2>&1; then
            echo "@aws/agentcore@$VERSION is already on npm, skipping publish"
          else
            npm publish "$TARBALL" --access public --tag "$DIST_TAG"
          fi

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        # A rerun after a failed asset upload re-uploads into the existing release instead of failing on the tag.
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" --clobber "$TARBALL" dist/bin/*
          else
            gh release create "v$VERSION" --target "$REF" --title "v$VERSION" \
              --generate-notes --notes-start-tag "$PREVIOUS_TAG" \
              ${{ steps.release.outputs.dist_tag == 'rc' && '--prerelease' || '--latest' }} \
              "$TARBALL" dist/bin/*
          fi
