# Publish v0.x releases to @aws/agentcore to npm under the v0-latest dist tag
name: release-publish

on:
  workflow_dispatch:
  push:
    branches: [v0.x]

jobs:
  check-release:
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      pull-requests: read
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: Check for a merged v0 release PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != v0.x ]]; then
            echo "::error::v0 releases must run from v0.x, not $GITHUB_REF_NAME"
            exit 1
          fi
          IS_RELEASE=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            | jq -r --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" '
                any(.[][];
                  .user.id == 282717993 and
                  .merged_at != null and
                  .merge_commit_sha == $sha and
                  .head.repo.full_name == $repository and
                  .base.ref == $ref and
                  (.head.ref | startswith("release/v"))
                )')
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$IS_RELEASE" != true ]]; then
            echo "::error::Manual recovery must select the v0 branch while its tip is a merged automation-created release PR"
            exit 1
          fi
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

  verify:
    needs: check-release
    if: needs.check-release.outputs.is_release == 'true'
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
    env:
      AGENTCORE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - uses: astral-sh/setup-uv@v7
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@amazon.com"
          git config --global user.name "CI"
      - run: npm ci
      - name: Validate v0 version and CDK pin
        run: |
          node - <<'NODE'
          const semver = require("semver");
          const cliVersion = require("./package.json").version;
          const cdkVersion = require("./src/assets/cdk/package.json").dependencies["@aws/agentcore-cdk"];
          if (!semver.valid(cliVersion) || semver.major(cliVersion) !== 0 || semver.prerelease(cliVersion)) {
            throw new Error(`Expected a stable v0 CLI version, found ${cliVersion}`);
          }
          if (!semver.valid(cdkVersion) || semver.major(cdkVersion) !== 0) {
            throw new Error(`Expected an exact v0 CDK pin, found ${cdkVersion}`);
          }
          NODE
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - name: Resolve v0 release
        id: release
        env:
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "v$VERSION")
            if [[ "$TAG_SHA" != "$REF" ]]; then
              echo "::error::v$VERSION already points to $TAG_SHA, not $REF"
              exit 1
            fi
          fi
          PREVIOUS=$(git tag -l 'v0.*' | grep -E '^v0\.[0-9]+\.[0-9]+$' \
            | xargs npx --no-install semver --range "<$VERSION" | tail -1)
          if [[ -z "$PREVIOUS" ]]; then
            echo "::error::No previous stable v0 tag found before v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=v$PREVIOUS" >> "$GITHUB_OUTPUT"
      - name: Pack CLI
        run: npm pack --ignore-scripts --silent
      - uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: aws-agentcore-*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@aws/agentcore
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v8
        with:
          name: release-tarball
      - name: Publish to npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@aws/agentcore@$VERSION" version >/dev/null 2>&1; then
            echo "@aws/agentcore@$VERSION is already on npm, skipping publish"
          else
            npm publish "aws-agentcore-$VERSION.tgz" --provenance --access public --tag v0-latest
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          PREVIOUS_TAG: ${{ needs.verify.outputs.previous_tag }}
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" --clobber "aws-agentcore-$VERSION.tgz"
          else
            gh release create "v$VERSION" --target "$REF" --title "v$VERSION" \
              --generate-notes --notes-start-tag "$PREVIOUS_TAG" --latest=false \
              "aws-agentcore-$VERSION.tgz"
          fi
