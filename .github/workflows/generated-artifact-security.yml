# Generates every supported Python project through the released CLI path, resolves fresh lockfiles,
# and scans both those dependencies and generated ARM64 container images.
name: generated-artifact-security
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

env:
  AGENTCORE_TELEMETRY_DISABLED: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Enable ARM64 container builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true

      - name: Scan generated projects and images
        env:
          AGENTCORE_CLI_PATH: node ${{ github.workspace }}/dist/index.js
          GENERATED_ARTIFACT_SECURITY_REPORT_DIR: ${{ github.workspace }}/out/generated-artifact-security/reports
        run: bun run test:e2e:generated-artifact-security

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: generated-artifact-security-${{ github.sha }}
          path: out/generated-artifact-security
          if-no-files-found: error
          retention-days: 30
