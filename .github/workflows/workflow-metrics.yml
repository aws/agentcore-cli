name: Workflow Metrics
on:
  workflow_run:
    workflows: ['canary(refactor)']
    types: [completed]

permissions:
  id-token: write

jobs:
  metrics:
    uses: aws/agentcore-devx-devtools/.github/workflows/workflow-metrics.yml@d69d92d498acb6d06739a72515ecdc71c69f2777
    with:
      namespace: AgentCoreCLI/Workflows
      os: Linux
      role-secret-name: E2E_AWS_ROLE_ARN
    secrets:
      WORKFLOW_SECRETS_READER_ROLE_ARN: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
