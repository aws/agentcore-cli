name: Workflow Metrics
on:
  workflow_run:
    workflows: [canary]
    types: [completed]

permissions:
  id-token: write

jobs:
  metrics:
    uses: aws/agentcore-devx-devtools/.github/workflows/workflow-metrics.yml@c2106996dd94e56f6c5fad625c83573e9724fb63
    with:
      namespace: AgentCoreCLI/Workflows
      os: Linux
      role-secret-name: E2E_AWS_ROLE_ARN
    secrets:
      WORKFLOW_SECRETS_READER_ROLE_ARN: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
