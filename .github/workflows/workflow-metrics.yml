name: Workflow Metrics
on:
  workflow_run:
    workflows: [canary]
    types: [completed]

permissions:
  id-token: write

jobs:
  metrics:
    uses: aws/agentcore-devx-devtools/.github/workflows/workflow-metrics.yml@28f401925cbdd8900e468d10ed950b48fd2cde1a
    with:
      namespace: AgentCoreCLI/Workflows
      os: Linux
      role-secret-name: E2E_AWS_ROLE_ARN
    secrets:
      WORKFLOW_SECRETS_READER_ROLE_ARN: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
