name: AgentCore Harness Reviewing

on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'GitHub PR URL to review (e.g. https://github.com/org/repo/pull/123)'
        required: true
        type: string

permissions:
  id-token: write
  pull-requests: write
  issues: write
  contents: read

jobs:
  call:
    uses: aws/agentcore-devx-devtools/.github/workflows/reusable-pr-ai-review.yml@44e99b13129947c1bcb5fb82ecbbc1208a57d045
    with:
      runner: codebuild
      pr_url: ${{ inputs.pr_url || github.event.pull_request.html_url }}
      secret_source: secrets-manager
      system_prompt_path: .github/harness/prompts/system.md
      review_prompt_path: .github/harness/prompts/review.md
    secrets: inherit
