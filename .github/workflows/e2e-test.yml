name: e2e-test
on:
  workflow_call:
    inputs:
      ref:
        description: git reference (commit, branch, or tag) for the E2E test suite
        required: false
        type: string
        default: ""
      npmVersion:
        description: install this exact published npm version instead of building the CLI from source
        required: false
        type: string
        default: ""
      tags:
        description: Vitest tag expression, for example runtime || canary
        required: false
        type: string
        default: ""
      linuxOnly:
        description: Run E2E tests only on Linux
        required: false
        type: boolean
        default: false
    secrets:
      WORKFLOW_SECRETS_READER_ROLE_ARN:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: git reference (commit, branch, or tag) to build and test
        type: string
        default: ""
      tags:
        description: Vitest tag expression, for example runtime || canary
        type: string
        default: ""
      linuxOnly:
        description: Run E2E tests only on Linux
        type: boolean
        default: false

concurrency:
  group: e2e-test-${{ inputs.ref || github.ref }}-${{ inputs.tags || 'all' }}-${{ inputs.linuxOnly && 'linux-only' || 'all-os' }}
  cancel-in-progress: false

env:
  AGENTCORE_TELEMETRY_DISABLED: "1"

jobs:
  authorize:
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      id-token: write
      contents: read
    outputs:
      is-authorized: ${{ github.workflow == 'canary' || steps.check.outputs.is_authorized == 'true' }}
    steps:
      - name: Fetch secrets from Secrets Manager
        uses: aws/agentcore-devx-devtools/.github/actions/fetch-secrets@e68d09b0c33dfb7a798448d50e6b48beedf00a3b
        with:
          role-arn: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
          repo: AUTHORIZED_USERS
      - name: Check authorization
        id: authz
        uses: aws/agentcore-devx-devtools/.github/actions/check-authorized-user@e68d09b0c33dfb7a798448d50e6b48beedf00a3b
        with:
          subject: ${{ github.actor }}
          authorized-users: ${{ env.AUTHORIZED_USERS }}
      - name: Determine authorization
        id: check
        env:
          IS_AUTHORIZED: ${{ steps.authz.outputs.is-authorized }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$IS_AUTHORIZED" == "true" ]]; then
            echo "Actor ${ACTOR} is authorized"
            echo "is_authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "Actor ${ACTOR} is not in AUTHORIZED_USERS, skipping"
            echo "is_authorized=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: test (${{ matrix.name }})
    needs: authorize
    if: needs.authorize.outputs.is-authorized == 'true'
    runs-on: >-
      ${{ fromJSON(
        matrix.name == 'Linux' &&
          format('["codebuild-agentcore-e2e-{0}-{1}","e2e-linux"]', github.run_id, github.run_attempt)
        || matrix.name == 'Windows' &&
          format('["codebuild-agentcore-e2e-{0}-{1}","image:windows-1.0","e2e-windows"]', github.run_id, github.run_attempt)
        || matrix.name == 'macOS' && '["macos-latest"]'
        || matrix.name == 'Linux-arm64' && '["ubuntu-24.04-arm"]'
      ) }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.linuxOnly && '["Linux"]' || '["Linux","Linux-arm64","Windows","macOS"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Keep template installs on the newest Python supported by AgentCore CodeZip.
          python-version: "3.14"
      - run: bun install --frozen-lockfile
      - name: Fetch E2E role from Secrets Manager
        uses: aws/agentcore-devx-devtools/.github/actions/fetch-secrets@e68d09b0c33dfb7a798448d50e6b48beedf00a3b
        with:
          role-arn: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
          repo: E2E_AWS_ROLE_ARN
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.E2E_AWS_ROLE_ARN }}
          aws-region: ${{ vars.E2E_REGION || 'us-east-1' }}
          unset-current-credentials: true
      # box ships only arm64 builds, so only the macOS (Apple silicon) and Linux arm64 runners can run
      # the Box tests. They skip on a runner with no box on PATH.
      - name: Install box
        if: matrix.name == 'macOS' || matrix.name == 'Linux-arm64'
        env:
          # The build's key in boxRelease.json, which pins its archive and SHA-256.
          BUILD: ${{ matrix.name == 'macOS' && 'darwin' || 'linux' }}
        run: |
          PIN=src/core/project/backends/boxRelease.json
          REPO=$(jq -er .box.repo "$PIN")
          # A build may name its own release, for a release whose build of this machine is broken.
          VER=$(jq -er ".box.${BUILD}.version // .box.version" "$PIN")
          ASSET=$(jq -er ".box.${BUILD}.asset" "$PIN")
          SHA=$(jq -er ".box.${BUILD}.sha256" "$PIN")
          WORK=$(mktemp -d)
          curl -fsSL --retry 3 -o "${WORK}/${ASSET}" \
            "https://github.com/${REPO}/releases/download/v${VER}/${ASSET}"
          # Check against the pin in the repository, not a checksum file of the same release.
          # Linux has sha256sum, and macOS may have only shasum.
          SUM=$(command -v sha256sum || echo "shasum -a 256")
          echo "${SHA}  ${WORK}/${ASSET}" | $SUM -c -
          # box reads its packs from resources/ beside it, so keep the release together.
          sudo mkdir -p /opt/box
          sudo tar --no-same-owner -xzf "${WORK}/${ASSET}" -C /opt/box
          sudo ln -sf /opt/box/box /usr/local/bin/box
          box --version
      # Ubuntu 24.04 lets AppArmor stop an unprivileged process from making a user namespace, which
      # `box run` needs for its sandbox. The runner is a throwaway VM.
      - name: Allow user namespaces for box
        if: matrix.name == 'Linux-arm64'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build CLI
        if: inputs.npmVersion == ''
        run: bun run build
      - name: Install published CLI
        if: inputs.npmVersion != ''
        env:
          NPM_VERSION: ${{ inputs.npmVersion }}
        run: |
          npm install --global "@aws/agentcore@${NPM_VERSION}"
          agentcore --version
      - name: Run all E2E tests
        if: inputs.tags == ''
        env:
          AGENTCORE_CLI_PATH: ${{ inputs.npmVersion != '' && 'agentcore' || format('node {0}/dist/index.js', github.workspace) }}
          AWS_REGION: ${{ vars.E2E_REGION || 'us-east-1' }}
        run: bun run test:e2e
      - name: Run tagged E2E tests
        if: inputs.tags != ''
        env:
          AGENTCORE_CLI_PATH: ${{ inputs.npmVersion != '' && 'agentcore' || format('node {0}/dist/index.js', github.workspace) }}
          AWS_REGION: ${{ vars.E2E_REGION || 'us-east-1' }}
        run: bun run test:e2e -- --tagsFilter="${{ inputs.tags }}"
