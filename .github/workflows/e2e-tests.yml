name: E2E Tests

on:
  pull_request:
    branches: [main, refactor, "feat/**"]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - ".github/workflows/e2e-tests.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Pack CLI
        id: tarball
        run: |
          bun pm pack
          tarball="$(find . -maxdepth 1 -name 'agentcore-*.tgz' -print -quit)"
          test -n "$tarball"
          echo "path=$tarball" >> "$GITHUB_OUTPUT"

      - name: Install packed CLI
        run: bun add --global "${{ steps.tarball.outputs.path }}"

      - name: Run packed CLI
        run: agentcore --help
