# Publishes @aws/agentcore to npm and creates the matching GitHub release.
#
# rc:     dispatch -> version -> check/build/unit-test -> publish <next>-rc.N under the `rc` dist-tag,
#         gated by the npm-publish-approval environment.
# stable: dispatch -> version -> release PR bumping package.json. Merging that PR re-enters this
#         workflow, which runs check/build/unit-test and publishes under `latest`.
#
# package.json always holds the last published stable version. rc numbers come from git tags, never commits.
name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to bump from the last stable release
        required: true
        type: choice
        options: [major, minor, patch]
      channel:
        description: rc publishes after approval, stable opens a release PR
        required: true
        type: choice
        options: [rc, stable]
      dry_run:
        description: Build and pack, but skip npm publish and the GitHub release
        type: boolean
        default: false
  pull_request:
    types: [closed]
    # TODO: switch to main once the refactor lands there.
    branches: [refactor]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && startsWith(github.head_ref, 'release/'))
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    outputs:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      channel: ${{ inputs.channel || 'stable' }}
      action: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && 'pull-request' || 'publish' }}
      version: ${{ steps.resolve.outputs.version }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2

      - name: Resolve version
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          set -euo pipefail
          if [ -n "$BUMP" ]; then
            BASE=$(bun pm version "$BUMP" --no-git-tag-version)
          else
            BASE="v$(bun pm pkg get version | tr -d '"')"
          fi
          if git rev-parse -q --verify "refs/tags/$BASE" >/dev/null; then
            echo "::error::$BASE is already released"
            exit 1
          fi

          VERSION="${BASE#v}"
          PREVIOUS=""
          if [ "$CHANNEL" = rc ]; then
            LAST=$(git tag -l "$BASE-rc.*" | sed 's/.*-rc\.//' | sort -n | tail -1)
            VERSION="$VERSION-rc.$(( ${LAST:--1} + 1 ))"
            [ -n "$LAST" ] && PREVIOUS="$BASE-rc.$LAST"
          fi
          # Stable releases and rc.0 take their notes from the previous stable release.
          [ -n "$PREVIOUS" ] || PREVIOUS="v$(git tag -l 'v*' | xargs bunx semver@7 --range "<$VERSION" | tail -1)"

          {
            echo "version=$VERSION"
            echo "previous_tag=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"
          echo "$VERSION (notes since $PREVIOUS)" >> "$GITHUB_STEP_SUMMARY"

  release-pr:
    needs: version
    if: needs.version.outputs.action == 'pull-request'
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
          REF: ${{ needs.version.outputs.ref }}
        run: |
          set -euo pipefail
          BRANCH="release/v$VERSION"
          bun pm version "$VERSION" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"

          NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$REF" -f previous_tag_name="$PREVIOUS_TAG" --jq .body)
          gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "chore(release): v$VERSION" --body "Merging publishes \`@aws/agentcore@$VERSION\` to npm under \`latest\` and creates the \`v$VERSION\` release.

          $NOTES"

  check:
    needs: version
    if: needs.version.outputs.action == 'publish'
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.version.outputs.ref }}
  build:
    needs: version
    if: needs.version.outputs.action == 'publish'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.version.outputs.ref }}
  unit-test:
    needs: version
    if: needs.version.outputs.action == 'publish'
    uses: ./.github/workflows/unit-test.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.version.outputs.ref }}

  publish:
    needs: [version, check, build, unit-test]
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    # npm-publish-approval requires a reviewer. npm-publish does not: merging the release PR was the approval.
    environment:
      name: ${{ needs.version.outputs.channel == 'rc' && 'npm-publish-approval' || 'npm-publish' }}
      url: https://www.npmjs.com/package/@aws/agentcore/v/${{ needs.version.outputs.version }}
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REF: ${{ needs.version.outputs.ref }}
      PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile

      - run: bun pm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: bun run build
      - id: pack
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts)" >> "$GITHUB_OUTPUT"
      - run: bun run compile

      - if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ needs.version.outputs.channel == 'rc' && 'rc' || 'latest' }}
        run: npm publish "$TARBALL" --provenance --access public --tag "$DIST_TAG"

      - if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          gh release create "v$VERSION" --target "$REF" --title "v$VERSION" \
            --generate-notes --notes-start-tag "$PREVIOUS_TAG" \
            ${{ needs.version.outputs.channel == 'rc' && '--prerelease' || '--latest' }} \
            "$TARBALL" dist/bin/*

      - if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.VERSION }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            dist/bin/*
