# Placeholder to keep the v0-only release workflow available for manual dispatch
# after v1 becomes the default branch. Select main (later v0.x) in the branch
# picker to run that branch's real release.yml.
name: Release

on:
  workflow_dispatch:

jobs:
  refuse:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The v0 release workflow runs from main (later v0.x). Select that branch and try again."
          exit 1
