# Verifies a commit on every platform in one job each: static checks (Linux only, they are
# platform-independent), bundle, package, compile, smoke test, unit tests.
# macOS is a separate job so callers can turn it off: a matrix entry cannot be skipped by input, and
# exclude runs before include so it cannot drop one.
name: verify
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      macos:
        default: true
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

env:
  AGENTCORE_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-job labels stop GitHub from routing a job to the runner CodeBuild created for another job.
          # https://docs.aws.amazon.com/codebuild/latest/userguide/sample-github-action-runners-update-labels.html
          - name: Linux
            runner: '["codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}", "verify-linux"]'
            target: linux-x64
            binary: ./dist/bin/agentcore-linux-x64
          - name: Windows
            runner: '["codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}", "image:windows-1.0", "verify-windows"]'
            target: windows-x64
            binary: ./dist/bin/agentcore-windows-x64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      # Every static check reports even when an earlier one fails. Build and tests only run when all pass.
      - run: bun run lint:check
        if: runner.os == 'Linux' && !cancelled()
      - run: bun run format:check
        if: runner.os == 'Linux' && !cancelled()
      - run: bun run typecheck
        if: runner.os == 'Linux' && !cancelled()
      - run: bun run audit
        if: runner.os == 'Linux' && !cancelled()
      - run: bun run secrets:check
        if: runner.os == 'Linux' && !cancelled()

      - run: bun run build
      - run: bun pm pack --ignore-scripts
      - run: bun run compile:${{ matrix.target }}
      - name: Smoke test binary
        run: ${{ matrix.binary }} --help

      # TODO: investigate sharding as repo grows:  https://bun.com/blog/release-notes/bun-v1.3.13#bun-test-shard-m-n-for-splitting-tests-across-ci-jobs
      - run: bun test --coverage --coverage-reporter=lcov

      - name: Upload to CodeCov
        # only upload on linux to avoid duplicates.
        if: always() && runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  verify-macos:
    name: macOS
    if: inputs.macos
    # CodeBuild does not support macOS.
    # https://docs.aws.amazon.com/codebuild/latest/userguide/action-runner-questions.html#action-runner-platform
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun pm pack --ignore-scripts
      - run: bun run compile:darwin-arm64
      - name: Smoke test binary
        run: ./dist/bin/agentcore-darwin-arm64 --help
      - run: bun test
