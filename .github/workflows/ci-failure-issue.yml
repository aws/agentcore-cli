name: CI Failure Issue

on:
  workflow_run:
    workflows:
      - Build and Test
      - Quality and Safety Checks
      - E2E Tests (Full Suite)
      - CodeQL
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  call:
    uses: aws/agentcore-devx-devtools/.github/workflows/reusable-ci-failure-issue.yml@458c0a684af0f9e3a013ec05cd23851def4f9cab
    secrets: inherit
