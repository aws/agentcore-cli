name: canary
on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # Resolve the commit hash for npm's latest published version.
  resolve_release:
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve latest stable release commit
        id: resolve
        run: |
          version="$(npm view @aws/agentcore@latest version)"
          tag_ref="refs/tags/v${version}"
          # Resolve annotated tags to their commit hash when needed.
          ref="$(git ls-remote https://github.com/aws/agentcore-cli.git "${tag_ref}" "${tag_ref}^{}" | awk -v tag_ref="${tag_ref}" '
            $2 == tag_ref "^{}" { print $1; found = 1; exit }
            $2 == tag_ref { tag_sha = $1 }
            END { if (!found && tag_sha != "") print tag_sha }
          ')"
          if [[ -z "${ref}" ]]; then
            echo "::error::No upstream tag found for @aws/agentcore@latest version ${version}"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve_release
    uses: ./.github/workflows/e2e-test.yml
    with:
      ref: ${{ needs.resolve_release.outputs.ref }}
      npmVersion: ${{ needs.resolve_release.outputs.version }}
      tags: canary
      linuxOnly: true
    secrets:
      WORKFLOW_SECRETS_READER_ROLE_ARN: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}

  heartbeat:
    needs: [resolve_release, e2e]
    # A cancelled run emits no failure sample; the alarm may still breach on missing data.
    if: ${{ !cancelled() }}
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch E2E role from Secrets Manager
        uses: aws/agentcore-devx-devtools/.github/actions/fetch-secrets@75989f65f7f193deaf83c237c36572d1a8f800b2
        with:
          role-arn: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
          repo: E2E_AWS_ROLE_ARN
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.E2E_AWS_ROLE_ARN }}
          aws-region: us-east-1
          unset-current-credentials: true
      - name: Emit canary heartbeat
        env:
          RESOLVE_RESULT: ${{ needs.resolve_release.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          status=failure
          if [[ "$RESOLVE_RESULT" == "success" && "$E2E_RESULT" == "success" ]]; then
            status=success
          fi
          bash .github/scripts/emit-canary-heartbeat.sh "$status"
