name: canary
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # Resolve the commit hash for the latest published @rc version.
  resolve_release:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve latest RC release commit
        id: resolve
        run: |
          version="$(npm view @aws/agentcore@rc version)"
          tag_ref="refs/tags/v${version}"
          # Resolve annotated tags to their commit hash when needed.
          ref="$(git ls-remote https://github.com/aws/agentcore-cli.git "${tag_ref}" "${tag_ref}^{}" | awk -v tag_ref="${tag_ref}" '
            $2 == tag_ref "^{}" { print $1; found = 1; exit }
            $2 == tag_ref { tag_sha = $1 }
            END { if (!found && tag_sha != "") print tag_sha }
          ')"
          if [[ -z "${ref}" ]]; then
            echo "::error::No upstream tag found for @aws/agentcore@rc version ${version}"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve_release
    uses: ./.github/workflows/e2e-test.yml
    with:
      ref: ${{ needs.resolve_release.outputs.ref }}
      tags: canary
      linuxOnly: true
    secrets:
      WORKFLOW_SECRETS_READER_ROLE_ARN: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
