name: canary-v1

on:
  # Scheduled workflows run from the default branch; tests come from v1.x.
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: canary-v1
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  canary:
    uses: ./.github/workflows/canary-release.yml
    with:
      major: 1
    secrets:
      WORKFLOW_SECRETS_READER_ROLE_ARN: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
