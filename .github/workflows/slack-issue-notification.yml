name: Slack Issue Notification

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: read

jobs:
  call:
    uses: aws/agentcore-devx-devtools/.github/workflows/reusable-slack-issue-notification.yml@c2106996dd94e56f6c5fad625c83573e9724fb63
    with:
      runner: codebuild
    secrets: inherit
