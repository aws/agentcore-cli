name: Build and Test

on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
    branches: ['main', 'feat/**']

permissions:
  contents: read

env:
  AGENTCORE_TELEMETRY_DISABLED: '1'

# Cancel in-progress runs for PRs; never cancel runs on main (merges should not abort each other)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version:
          ${{ github.event_name == 'pull_request' && fromJSON('["20.x"]') || fromJSON('["20.x", "22.x", "24.x"]') }}

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@amazon.com"
          git config --global user.name "CI"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run build --if-present
      - name: Test API docs generator
        if: matrix.node-version == '20.x'
        run: npm run test:docs
      - name: Pack tarball
        if: matrix.node-version == '20.x'
        run: npm pack
      - name: Install from tarball
        if: matrix.node-version == '20.x'
        run: npm install -g aws-agentcore-*.tgz
      - name: Verify packaged CLI runs
        if: matrix.node-version == '20.x'
        run: |
          agentcore --version
          agentcore create --name sanitytest --language Python --framework Strands --model-provider Bedrock --memory none --json
          test -f sanitytest/agentcore/agentcore.json
          agentcore package --directory integ-tests/fixtures/typescript-package
          test -f integ-tests/fixtures/typescript-package/agentcore/TestRuntime.zip
      - name: Upload tarball artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: '*.tgz'

  integ-test:
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version:
          ${{ github.event_name == 'pull_request' && fromJSON('["20.x"]') || fromJSON('["20.x", "22.x", "24.x"]') }}
        shard: [1/4, 2/4, 3/4, 4/4]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@amazon.com"
          git config --global user.name "CI"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run build --if-present
      - name: Run integration tests (shard ${{ matrix.shard }})
        run: npx vitest run --project integ --shard=${{ matrix.shard }}

  unit-test:
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version:
          ${{ github.event_name == 'pull_request' && fromJSON('["20.x"]') || fromJSON('["20.x", "22.x", "24.x"]') }}
        shard: [1/3, 2/3, 3/3]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@amazon.com"
          git config --global user.name "CI"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run build --if-present
      - name: Run unit tests (shard ${{ matrix.shard }})
        run: npx vitest run --project unit --shard=${{ matrix.shard }} --reporter=blob --reporter=verbose --coverage
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.node-version }}-${{ strategy.job-index }}
          path: .vitest-reports
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  merge-reports:
    needs: unit-test
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    if: always()

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - name: Download blob reports (Node 20)
        uses: actions/download-artifact@v8
        with:
          pattern: blob-20.x-*
          merge-multiple: true
          path: .vitest-reports/
      - name: Normalize blob report paths
        # Vitest blob reports store absolute test-file paths tied to the runner's
        # working directory. On GitHub-hosted runners every job shares
        # /home/runner/work/agentcore-cli/agentcore-cli, so the merge resolves fine.
        # On CodeBuild-hosted runners each job gets a unique
        # /codebuild/output/src<N>/... dir, so the merge job can't find the
        # shard-recorded paths and vitest exits with "No test files found".
        # Rewrite each shard's recorded repo root to this job's workspace before
        # merging. The regex is anchored to the CodeBuild src<N> path so it can't
        # touch test titles or other blob content; it is a no-op on GitHub runners.
        run: |
          node -e '
            const fs = require("node:fs");
            const dir = ".vitest-reports";
            const cwd = process.cwd();
            const re = /\/codebuild\/output\/src[0-9]+\/src\/actions-runner\/_work\/agentcore-cli\/agentcore-cli/g;
            for (const f of fs.readdirSync(dir)) {
              const p = `${dir}/${f}`;
              const before = fs.readFileSync(p, "utf8");
              const after = before.replace(re, () => cwd);
              if (after !== before) {
                fs.writeFileSync(p, after);
                console.log(`normalized paths in ${f}`);
              }
            }
          '
      - name: Merge reports
        run: npx vitest --mergeReports=.vitest-reports/ --project unit --coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  coverage:
    needs: merge-reports
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage/
      - name: Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          vite-config-path: vitest.config.ts
          file-coverage-mode: none
          coverage-thresholds: '{ "lines": 50, "branches": 50, "functions": 50, "statements": 50 }'
