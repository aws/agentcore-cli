# Orchestrates all CI checks on PRs and pushes to the v1 release branch.
name: CI
on:
  push:
    branches: [main, refactor, v1.x]
  pull_request:
    branches: [main, refactor, v1.x]
  workflow_dispatch:

concurrency:
  # Only one active run per PR, but each commit on a push event gets its own run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  generated-artifact-security:
    uses: ./.github/workflows/generated-artifact-security.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    if: github.event_name == 'push'
    uses: ./.github/workflows/e2e-test.yml
    permissions:
      id-token: write
      contents: read
    with:
      ref: ${{ github.sha }}
    secrets: inherit
